services:
  - type: web
    name: claritas-e2e-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev (both npm ci calls): NODE_ENV=production (set below) makes
    # plain `npm ci` skip devDependencies. The server needs typescript to run
    # `tsc`; e2e-suite needs it for its ENTIRE dependency list — @playwright/test,
    # @types/node, and typescript are all devDependencies there (see
    # e2e-suite/package.json), so without --include=dev that install step
    # silently installs nothing at all.
    #
    # No --with-deps on the Playwright install: that flag tries to install
    # OS-level system libraries via sudo, which Render's build sandbox
    # doesn't permit ("su: Authentication failure"). Render's own runtime
    # image is a reasonably complete Debian base, so the plain browser-binary
    # download is likely enough on its own — if Chromium still can't launch
    # at runtime due to a missing shared library, the fix is switching this
    # service to a Docker runtime using Playwright's own base image instead.
    buildCommand: >
      npm ci --include=dev && npm run build &&
      cd e2e-suite && npm ci --include=dev && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # The deployed frontend's origin — drives CORS for both the REST API
      # and the Socket.io handshake. Best-guess value; Vercel may assign a
      # different one if "claritas-e2e" collides globally (as happened with
      # Provisio), in which case this gets corrected and redeployed the same
      # way that did.
      - key: CLIENT_ORIGIN
        value: https://claritas-e2e.vercel.app
      # Render checks out the repo to /opt/render/project/src, and rootDir
      # above makes that .../src/server for build/start — so the bundled
      # suite committed at server/e2e-suite lands here at runtime.
      - key: PROVISIO_E2E_PATH
        value: /opt/render/project/src/server/e2e-suite
      # No local Provisio instance is reachable from this container, so
      # there's nothing meaningful to health-check for the "Local" target —
      # left blank on purpose, which envHealth.service.ts treats as "skip
      # this check" (ok: null) rather than a failure.
      - key: PROVISIO_LOCAL_HEALTH_URL
        value: ""
      - key: PROVISIO_LIVE_HEALTH_URL
        value: https://provisio-api.onrender.com/api/health
      # Secret — intentionally not set here. Render prompts for this in the
      # dashboard when the blueprint is deployed, so it's never committed.
      - key: MONGODB_URI
        sync: false
